<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeMeasurer Privacy Policy</title>
    <script>
        (function () {
            var langs = (navigator.languages && navigator.languages.length)
                ? navigator.languages
                : [navigator.language || navigator.userLanguage || 'en'];
            var isChinese = langs.some(function (lang) {
                return lang.toLowerCase().indexOf('zh') === 0;
            });
            window.location.replace(isChinese ? 'zh/' : 'en/');
        })();
    </script>
</head>
<body>
    <p>If you are not redirected automatically, please choose your language:</p>
    <ul>
        <li><a href="en/">English</a></li>
        <li><a href="zh/">中文</a></li>
    </ul>
</body>
</html>
